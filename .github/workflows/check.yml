name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - uses: arduino/setup-arduino-cli@v2
      - run: make setup
      - run: make compile
        env:
          WIFI_SSID: compile-test
          WIFI_PASSWORD: placeholder
