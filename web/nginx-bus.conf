    server {
        listen 80;
        listen [::]:80;
        server_name bus.local bus.lan;
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.8.0/24;
        deny all;
        root /Users/alekseykutuzov/bus/web/public;
        include /opt/homebrew/etc/nginx/mime.types;
        default_type application/octet-stream;
        client_max_body_size 1k;
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store";
        }
        location = /api/control/lights {
            proxy_pass http://127.0.0.1:8792/control/lights;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
            proxy_read_timeout 9s;
        }
        location /api/control/ {
            proxy_pass http://127.0.0.1:8792/control/;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
            proxy_read_timeout 3s;
        }
        location = /api/command { return 410; }
        location = /api/video-status {
            proxy_pass http://127.0.0.1:8792/health;
            proxy_read_timeout 3s;
        }
        location = /api/status {
            proxy_pass http://192.168.8.209/status;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location = /api/session { return 410; }
        location = /api/snapshot {
            proxy_pass http://192.168.8.209/snapshot;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location = /camera/stream {
            proxy_pass http://127.0.0.1:8792/stream;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
        }
        location /api/ { return 404; }
    }
