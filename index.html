<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Bus</title>
<style>body{font:18px system-ui;max-width:480px;margin:40px auto;padding:16px}input{width:100%}button{font:inherit;padding:14px;margin:8px 4px 8px 0}#stop{background:#fcc}small{color:#555}</style>
<h1>Bus</h1>
<p id="status" role="status">Connecting...</p>
<h2>Motors</h2>
<label for="speed">Speed: <output id="speed-value">47%</output></label>
<input id="speed" type="range" min="0" max="100" value="47">
<button id="forward">Forward</button><button id="reverse">Reverse</button><button id="stop">Stop</button>
<p><small>Both motors run together until Stop or connection loss.</small></p>
<h2>Servo</h2>
<label for="angle">Angle: <output id="angle-value">90°</output></label>
<input id="angle" type="range" min="0" max="180" value="90">
<p><small>Slide to move. Servo holds its last angle. Actual travel varies.</small></p>
<p id="error" role="alert"></p>
<script src="/controls.js"></script></html>
